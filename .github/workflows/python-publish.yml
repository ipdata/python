name: Test and Publish ipdata to PyPI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # ubuntu-latest now resolves to Ubuntu 26.04, for which actions/setup-python has no Python 3.9 builds
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Test with pytest (offline tests only, no API key needed)
      run: |
        python -m pytest -m "not api"

  build-n-publish:
    name: Build and publish to PyPI
    if: github.event_name == 'push'
    # kept on the same image as the test job
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install python-dotenv
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
    - name: Test with pytest
      run: |
        python -m pytest
      env:
        IPDATA_API_KEY: ${{ secrets.IPDATA_API_KEY }}
    - name: Install build
      run: python -m pip install build
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        .
    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_PASSWORD }}
